[project]
name = "bgsub"
version = "0.1.0"
description = "Fast, unbiased, universal background estimation and subtraction for diffraction frames (pod subproject)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
numba = ["numba>=0.60"]
harness = ["pandas>=2.2", "pyarrow>=16", "tifffile>=2024", "scikit-image>=0.24", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
